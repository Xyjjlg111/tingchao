name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  affect-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18'
      - name: Prosody + affect unit tests (no model needed)
        working-directory: service
        run: node test-affect.mjs
      - name: Standards store tests
        working-directory: service
        run: |
          node --input-type=module -e "
          import { createStandards } from './lib/standards.mjs';
          import { mkdtempSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          const f = join(mkdtempSync(join(tmpdir(),'tc-')), 'standards.json');
          const s = createStandards(f); s.load();
          const p = s.upsert({ qq: '1000000000', name: 'demo', keywords: 'slow,cold' });
          if (p.qq !== '1000000000') throw new Error('upsert failed');
          const eff = s.effectiveFor('1000000000');
          if (eff.source !== 'person') throw new Error('effectiveFor failed');
          console.log('standards ok');
          "
